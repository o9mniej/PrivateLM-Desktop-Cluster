name: Windows worker build

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/windows-worker/**"
      - "local_plugins/llama_flutter_android/android/src/main/cpp/llama.cpp/**"
      - ".github/workflows/windows-worker.yml"

permissions:
  contents: read

jobs:
  build-cuda:
    name: Windows x64 (CUDA)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.32
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'

      - name: Configure
        shell: pwsh
        run: cmake -S desktop/windows-worker -B desktop/windows-worker/build-cuda -A x64 -DPRIVATELM_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=120

      - name: Build
        run: cmake --build desktop/windows-worker/build-cuda --config Release --parallel

      - name: Stage CUDA worker
        shell: pwsh
        run: |
          $out = "desktop/windows-worker/dist/cuda"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem "desktop/windows-worker/build-cuda" -Recurse -File |
            Where-Object { $_.Extension -eq ".dll" -or $_.Name -eq "privatelm-worker.exe" } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $out -Force }

          # ggml-cuda.dll links dynamically to the CUDA runtime and cuBLAS.
          # These toolkit DLLs are not copied into the CMake build directory,
          # so stage them beside the worker for a self-contained ZIP.
          if (-not $env:CUDA_PATH) {
            throw "CUDA_PATH is not set by the CUDA Toolkit installation"
          }
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          $cudaRuntime = Get-ChildItem $cudaBin -File |
            Where-Object {
              $_.Name -match '^(cudart64_12|cublas64_12|cublasLt64_12|nvJitLink_12|nvrtc64_12|nvrtc-builtins64_12|nvfatbin).*\.dll$'
            }
          foreach ($dll in $cudaRuntime) {
            Copy-Item -LiteralPath $dll.FullName -Destination $out -Force
          }

          $required = @(
            "privatelm-worker.exe", "ggml.dll", "ggml-base.dll",
            "ggml-rpc.dll", "ggml-cuda.dll",
            "cudart64_12.dll", "cublas64_12.dll", "cublasLt64_12.dll"
          )
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $out $_)) }
          if ($missing.Count -gt 0) {
            throw "Missing required CUDA runtime file(s): $($missing -join ', ')"
          }

          Write-Host "Staged CUDA runtime files:"
          Get-ChildItem $out -File | Select-Object Name, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: privatelm-windows-worker-cuda
          path: desktop/windows-worker/dist/cuda/
          if-no-files-found: error
          retention-days: 14

  build-cpu:
    name: Windows x64 (CPU fallback)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S desktop/windows-worker -B desktop/windows-worker/build-cpu -A x64 -DPRIVATELM_ENABLE_CUDA=OFF

      - name: Build
        run: cmake --build desktop/windows-worker/build-cpu --config Release --parallel

      - name: Stage CPU worker
        shell: pwsh
        run: |
          $out = "desktop/windows-worker/dist/cpu"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem "desktop/windows-worker/build-cpu" -Recurse -File |
            Where-Object { $_.Extension -eq ".dll" -or $_.Name -eq "privatelm-worker.exe" } |
            ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $out -Force }

          $required = @("privatelm-worker.exe", "ggml.dll", "ggml-base.dll", "ggml-cpu.dll", "ggml-rpc.dll")
          $missing = $required | Where-Object { -not (Test-Path (Join-Path $out $_)) }
          if ($missing.Count -gt 0) {
            throw "Missing required CPU runtime file(s): $($missing -join ', ')"
          }

          Write-Host "Staged CPU runtime files:"
          Get-ChildItem $out -File | Select-Object Name, Length | Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: privatelm-windows-worker-cpu
          path: desktop/windows-worker/dist/cpu/
          if-no-files-found: error
          retention-days: 14
