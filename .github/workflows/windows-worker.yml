name: Windows worker build

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/windows-worker/**"
      - "local_plugins/llama_flutter_android/android/src/main/cpp/llama.cpp/**"
      - ".github/workflows/windows-worker.yml"

permissions:
  contents: read

jobs:
  build-cuda:
    name: Windows x64 (CUDA)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.32
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "visual_studio_integration"]'

      - name: Configure
        shell: pwsh
        run: cmake -S desktop/windows-worker -B desktop/windows-worker/build-cuda -A x64 -DPRIVATELM_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=120

      - name: Build
        run: cmake --build desktop/windows-worker/build-cuda --config Release --parallel

      - name: Stage CUDA worker
        shell: pwsh
        run: |
          $out = "desktop/windows-worker/dist/cuda"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem "desktop/windows-worker/build-cuda" -Recurse -File |
            Where-Object { $_.Name -match '^(privatelm-worker|ggml-.*)\.(exe|dll)$' } |
            Copy-Item -Destination $out -Force
          if (-not (Test-Path "$out/privatelm-worker.exe")) {
            throw "privatelm-worker.exe was not found in the build output"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: privatelm-windows-worker-cuda
          path: desktop/windows-worker/dist/cuda/
          if-no-files-found: error
          retention-days: 14

  build-cpu:
    name: Windows x64 (CPU fallback)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -S desktop/windows-worker -B desktop/windows-worker/build-cpu -A x64 -DPRIVATELM_ENABLE_CUDA=OFF

      - name: Build
        run: cmake --build desktop/windows-worker/build-cpu --config Release --parallel

      - name: Stage CPU worker
        shell: pwsh
        run: |
          $out = "desktop/windows-worker/dist/cpu"
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem "desktop/windows-worker/build-cpu" -Recurse -File |
            Where-Object { $_.Name -match '^(privatelm-worker|ggml-.*)\.(exe|dll)$' } |
            Copy-Item -Destination $out -Force
          if (-not (Test-Path "$out/privatelm-worker.exe")) {
            throw "privatelm-worker.exe was not found in the build output"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: privatelm-windows-worker-cpu
          path: desktop/windows-worker/dist/cpu/
          if-no-files-found: error
          retention-days: 14
